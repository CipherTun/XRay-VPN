name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_project/my-tunnel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      # Compile native protocol libraries (DNSTT, SlowDNS, Psiphon, OpenConnect) into AARs
      - name: Build Native Protocol Libraries
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          chmod +x tools/build_libs/*.sh
          ./tools/build_libs/build_all.sh

      # Generate android/ (kept out of git) with the correct package: xyz.xray.vpn
      - run: flutter create --platforms=android --org xyz.xray --project-name vpn .
      - run: python3 tools/patch_android.py

      # Copy compiled AARs into android/app/libs/
      - name: Install Native AARs
        run: |
          mkdir -p android/app/libs
          cp -f tools/build_libs/*.aar android/app/libs/ 2>/dev/null || true

      # Dart has no inline regex flags: (?i)(?m) throw "Invalid group" at runtime. Rewrite them.
      - run: python3 tools/fix_regex_flags.py
      - run: flutter pub get

      # Only real errors fail the build; style hints are informational.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      # Build separate release APKs per ABI (arm64-v8a and armeabi-v7a) without mixing libraries
      - name: Build Split Release APKs
        run: |
          flutter build apk --release --no-shrink --split-per-abi --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../../xray-vpn-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../../xray-vpn-armeabi-v7a.apk

      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-arm64-v8a-apk
          path: xray-vpn-arm64-v8a.apk

      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-armeabi-v7a-apk
          path: xray-vpn-armeabi-v7a.apk

      # Debug build for diagnosing connection issues
      - name: Build arm64 Debug APK
        run: |
          flutter build apk --debug --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-debug.apk ../../xray-vpn-debug-arm64.apk

      - name: Upload arm64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-debug-arm64-apk
          path: xray-vpn-debug-arm64.apk
