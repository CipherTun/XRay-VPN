name: Build XRay Vpn APKs

on:
  push:
  workflow_dispatch:
    inputs:
      libxray_ref:
        description: "libXray release tag, or 'latest' for the newest published stable release"
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LIBXRAY_REF: ${{ inputs.libxray_ref || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # OpenVPN 2.0.0 requires NDK 27 for its Android 16 KB page-size-ready build.
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          go version
          java -version

      - name: Generate Android project
        run: flutter create --platforms=android --org xyz.xray --project-name vpn .

      - name: Patch native VPN services
        run: python3 tools/patch_android.py

      - name: Verify generated Android sources before compilation
        run: python3 tools/verify_android_project.py

      - name: Build latest published official libXray Android AAR
        run: python3 tools/build_libxray.py

      - name: Record this build in the APK assets
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('assets/build-info.json')
          data = json.loads(p.read_text())
          data['appVersion'] = '2.4.0'
          data['appBuildNumber'] = int(os.environ['BUILD_NUMBER'])
          data['sourceCommit'] = os.environ['SOURCE_COMMIT']
          p.write_text(json.dumps(data, indent=2) + '\n')
          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text()
          import re
          text, n = re.subn(r'(?m)^version:\s*2\.4\.0\+\d+\s*$', f"version: 2.4.0+{os.environ['BUILD_NUMBER']}", text, count=1)
          if n != 1:
              raise SystemExit('Could not set unique app build number in pubspec.yaml')
          pubspec.write_text(text)
          PY

      # This script only repairs Dart RegExp inline flags; it does not alter VPN semantics.
      - name: Normalize Dart regular expressions
        run: python3 tools/fix_regex_flags.py

      - name: Resolve latest compatible Dart dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: flutter test

      - name: Build split release APKs (ARM32 and ARM64)
        run: |
          flutter build apk --release --no-shrink --split-per-abi --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk xray-vpn-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk xray-vpn-armeabi-v7a.apk

      - name: Verify APK payloads and embedded build metadata
        run: |
          set -euo pipefail
          for spec in "arm64-v8a: xray-vpn-arm64-v8a.apk" "armeabi-v7a: xray-vpn-armeabi-v7a.apk"; do
            abi="${spec%%:*}"
            apk="${spec#*: }"
            test -s "$apk"
            unzip -Z1 "$apk" > "${apk}.contents"
            grep -q "^lib/$abi/libgojni.so$" "${apk}.contents" || { echo "Missing libXray Go runtime for $abi"; exit 1; }
            grep -q '^classes[0-9]*\.dex$' "${apk}.contents" || { echo "Missing DEX bytecode in $apk"; exit 1; }
            unzip -p "$apk" assets/flutter_assets/assets/build-info.json > "${apk%.apk}-build-info.json"
            grep -q '"engine": "XTLS/libXray"' "${apk%.apk}-build-info.json"
            grep -q '"release":' "${apk%.apk}-build-info.json"
            echo "Verified $apk"
            unzip -l "$apk" | grep "lib/$abi/.*\\.so" || true
          done
          cp libxray-release.txt xray-vpn-libxray-release.txt

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-arm64-v8a-apk
          path: |
            xray-vpn-arm64-v8a.apk
            xray-vpn-arm64-v8a-build-info.json
            xray-vpn-libxray-release.txt
            pubspec.lock
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARM32 release APK
        uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-armeabi-v7a-apk
          path: |
            xray-vpn-armeabi-v7a.apk
            xray-vpn-armeabi-v7a-build-info.json
            xray-vpn-libxray-release.txt
            pubspec.lock
          if-no-files-found: error
          retention-days: 30

      - name: Build ARM32 debug APK for device diagnostics
        run: |
          flutter build apk --debug --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-debug.apk xray-vpn-debug-armeabi-v7a.apk

      - name: Upload ARM32 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-debug-armeabi-v7a-apk
          path: xray-vpn-debug-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build ARM64 debug APK for diagnostics
        run: |
          flutter build apk --debug --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-debug.apk xray-vpn-debug-arm64.apk

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xray-vpn-debug-arm64-apk
          path: xray-vpn-debug-arm64.apk
          if-no-files-found: error
          retention-days: 14
